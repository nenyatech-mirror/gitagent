name: Lyra
description: Google Lyra running locally on Ollama — native tool calling.

model:
  # Gemma 4 (E2B, int4 QAT) — natively supports tools + vision + reasoning.
  preferred: "ollama:gemma4:e2b-it-qat@http://localhost:11434/v1"
  fallback: []
  constraints:
    max_tokens: 8192   # low caps truncate long code generations mid-line

tools: [cli, read, write, pdf]

runtime:
  max_turns: 8
