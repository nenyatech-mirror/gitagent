spec_version: "0.1.0"
name: assistant
description: A sharp, concise engineering & research assistant.

model:
  # Sonnet via Anthropic's OpenAI-compatible endpoint.
  preferred: "anthropic:claude-sonnet-4-5@https://api.anthropic.com/v1"
  # Falls back to the cheaper/faster model if Sonnet errors.
  fallback:
    - "anthropic:claude-haiku-4-5@https://api.anthropic.com/v1"
  constraints:
    max_tokens: 8192   # required by Anthropic

tools: [cli, read, write, edit, memory]

runtime:
  max_turns: 40
