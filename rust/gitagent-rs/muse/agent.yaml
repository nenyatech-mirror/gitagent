name: muse-glimmer
description: Meta's Muse Glimmer 30B — open agentic model, local, 4-bit (official).

model:
  # Official Ollama 4-bit (q4_K_M, 18.16 GB) — native template, tools, thinking.
  preferred: "ollama:muse-glimmer:30b@http://localhost:11434/v1"
  fallback:
    - "ollama:gemma4:e2b-it-qat@http://localhost:11434/v1"
  constraints:
    max_tokens: 2048

tools: [cli, read, write, edit, memory, pdf]

runtime:
  max_turns: 20
