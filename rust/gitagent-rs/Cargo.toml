[package]
name = "gitagent"
version = "0.1.0"
edition = "2021"
description = "Git-native AI agent — Rust port (faithful pi-core engine + gitagent SDK)"
license = "MIT"

[lib]
name = "gitagent"
path = "src/lib.rs"

[[bin]]
name = "gitagent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "io-std", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
futures-util = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
