[package]
name = "ira-desktop"
version = "0.1.0"
edition = "2021"
description = "Ira — desktop app (Tauri shell around the embedded Ira UI server)"

[dependencies]
ira = { path = ".." }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
